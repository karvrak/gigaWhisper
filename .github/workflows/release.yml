name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Force compatible CPU target to avoid illegal instruction errors
  RUSTFLAGS: "-C target-cpu=x86-64-v2"

jobs:
  # ============================================
  # Create Release Draft
  # ============================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.result }}
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # Extract the section for this version from CHANGELOG.md
          # Matches from "## [X.Y.Z]" until the next "## [" or end of file
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="No changelog entry found for v${VERSION}."
          fi

          # Write to file to preserve multiline content
          echo "$NOTES" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const notesFile = '${{ steps.changelog.outputs.notes_file }}';
            const changelogNotes = fs.readFileSync(notesFile, 'utf8').trim();
            const version = '${{ steps.get_version.outputs.VERSION }}';

            const body = `${changelogNotes}

            ---

            ## Installation

            Download the installer for your system:

            | Variant | Description | Download |
            |---------|-------------|----------|
            | **CPU** | Works on all systems | \`GigaWhisper_${version}_x64-cpu-setup.exe\` |
            | **Vulkan** | GPU acceleration (AMD/Intel/NVIDIA) | \`GigaWhisper_${version}_x64-vulkan-setup.exe\` |
            | **CUDA** | Best for NVIDIA GPUs | \`GigaWhisper_${version}_x64-cuda-setup.exe\` |

            ## Auto-Update

            If you already have GigaWhisper installed, you'll be prompted to update automatically (same variant).

            ---
            *Full changelog: [CHANGELOG.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CHANGELOG.md)*`;

            // Check if a release already exists for this tag
            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: `v${version}`
              });
              // Update the existing release back to draft and refresh its body
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.id,
                body: body,
                draft: true,
                prerelease: false
              });
              return existing.id;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `GigaWhisper v${version}`,
              body: body,
              draft: true,
              prerelease: false
            })
            return data.id

  # ============================================
  # Build Windows (3 variants)
  # ============================================
  build-windows:
    name: Build Windows (${{ matrix.variant }})
    needs: create-release
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            features: ""
            artifact_suffix: "cpu"
          - variant: vulkan
            features: "--features gpu-vulkan"
            artifact_suffix: "vulkan"
          - variant: cuda
            features: "--features gpu-cuda"
            artifact_suffix: "cuda"

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.variant }}-v3
          # Fresh cache - v3 to clear corrupted artifact names

      # CUDA setup (only for cuda variant)
      - name: Setup CUDA
        if: matrix.variant == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      # Copy CUDA DLLs for bundling (only for cuda variant)
      - name: Copy CUDA DLLs
        if: matrix.variant == 'cuda'
        shell: pwsh
        run: |
          $cudaPath = $env:CUDA_PATH
          Write-Host "CUDA_PATH: $cudaPath"

          # Create resources directory
          $resourcesDir = "src-tauri/resources"
          New-Item -ItemType Directory -Force -Path $resourcesDir

          # Copy CUDA runtime DLLs
          $dllsToCopy = @(
            "cudart64_12.dll",
            "cublas64_12.dll",
            "cublasLt64_12.dll"
          )

          foreach ($dll in $dllsToCopy) {
            $sourcePath = Join-Path $cudaPath "bin" $dll
            if (Test-Path $sourcePath) {
              Copy-Item $sourcePath $resourcesDir -Force
              Write-Host "Copied $dll"
            } else {
              Write-Host "Warning: $dll not found at $sourcePath"
              # Try alternative names for different CUDA versions
              $altDll = $dll -replace "64_12", "64_*"
              $found = Get-ChildItem -Path (Join-Path $cudaPath "bin") -Filter $altDll -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                Copy-Item $found.FullName $resourcesDir -Force
                Write-Host "Copied alternative: $($found.Name)"
              }
            }
          }

          # List copied DLLs
          Write-Host "Resources directory contents:"
          Get-ChildItem $resourcesDir

          # Update tauri.conf.json to include CUDA DLLs
          $tauriConf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $tauriConf.bundle.resources = @{ "resources/*.dll" = "./" }
          $tauriConf | ConvertTo-Json -Depth 20 | Set-Content "src-tauri/tauri.conf.json" -Encoding UTF8
          Write-Host "Updated tauri.conf.json to include CUDA DLLs"

      # Vulkan SDK setup (only for vulkan variant)
      - name: Setup Vulkan SDK
        if: matrix.variant == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@v1.0.4
        with:
          vulkan_version: 1.3.290.0
          install_runtime: true
          cache: true
          destination: ${{ github.workspace }}/vulkan-sdk

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify signing key is available
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Host "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set. The updater bundle (.nsis.zip) and signature (.sig) will not be generated without it."
            Write-Host "To fix: generate a key pair with 'npx tauri signer generate' and add the private key as a repository secret."
            exit 1
          }
          Write-Host "Signing key is available"

      - name: Build Tauri App
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ matrix.features }}

      - name: Verify build artifacts
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/release/bundle/nsis"
          Write-Host "Build artifacts in ${releaseDir}:"
          Get-ChildItem -Path $releaseDir | ForEach-Object { Write-Host "  $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

          $hasExe = (Get-ChildItem -Path $releaseDir -Filter "*.exe").Count -gt 0
          $hasZip = (Get-ChildItem -Path $releaseDir -Filter "*.nsis.zip").Count -gt 0
          $hasSig = (Get-ChildItem -Path $releaseDir -Filter "*.nsis.zip.sig").Count -gt 0

          if (-not $hasExe) {
            Write-Host "::error::No .exe installer found"
            exit 1
          }
          if (-not $hasZip) {
            Write-Host "::error::No .nsis.zip updater bundle found. This usually means the signing key is invalid or the updater plugin is misconfigured."
            exit 1
          }
          if (-not $hasSig) {
            Write-Host "::error::No .nsis.zip.sig signature file found"
            exit 1
          }
          Write-Host "All required artifacts present"

      # Rename artifacts to include variant
      - name: Rename artifacts
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $variant = "${{ matrix.variant }}"
          $releaseDir = "src-tauri/target/release/bundle/nsis"

          Write-Host "Looking for NSIS installer in: $releaseDir"
          Write-Host "All files in directory:"
          Get-ChildItem -Path $releaseDir -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }

          # Find NSIS installer (exclude already renamed files)
          $nsisFile = Get-ChildItem -Path $releaseDir -Filter "*.exe" | Where-Object { $_.Name -notmatch "-cpu-|-vulkan-|-cuda-" } | Select-Object -First 1

          if ($nsisFile) {
            $newName = "GigaWhisper_${version}_x64-${variant}-setup.exe"
            $newPath = Join-Path $releaseDir $newName
            Write-Host "Found: $($nsisFile.Name)"
            Write-Host "Renaming to: $newName"
            Move-Item $nsisFile.FullName $newPath -Force
            Write-Host "Renamed successfully"
          } else {
            Write-Host "ERROR: No NSIS installer found!"
            Write-Host "Available .exe files:"
            Get-ChildItem -Path $releaseDir -Filter "*.exe" | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }

          # Find the .nsis.zip updater bundle and its signature (Tauri v2 generates .nsis.zip.sig, not .exe.sig)
          $nsisZip = Get-ChildItem -Path $releaseDir -Filter "*.nsis.zip" | Where-Object { $_.Name -notmatch "-cpu-|-vulkan-|-cuda-" } | Select-Object -First 1
          if ($nsisZip) {
            $newZipName = "GigaWhisper_${version}_x64-${variant}-setup.nsis.zip"
            $newZipPath = Join-Path $releaseDir $newZipName
            Move-Item $nsisZip.FullName $newZipPath -Force
            Write-Host "Renamed updater bundle: $newZipName"

            $sigFile = "$($nsisZip.FullName).sig"
            if (Test-Path $sigFile) {
              Move-Item $sigFile "$newZipPath.sig" -Force
              Write-Host "Renamed updater signature file"
            } else {
              Write-Host "WARNING: No .nsis.zip.sig found at $sigFile"
            }
          } else {
            Write-Host "WARNING: No .nsis.zip updater bundle found"
          }

      # Upload renamed artifacts to release
      - name: Upload artifacts to release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $variant = "${{ matrix.variant }}"
          $releaseDir = "src-tauri/target/release/bundle/nsis"

          Write-Host "Uploading artifacts for variant: $variant"

          # Upload NSIS installer
          $exeFile = Join-Path $releaseDir "GigaWhisper_${version}_x64-${variant}-setup.exe"
          Write-Host "Looking for: $exeFile"

          if (Test-Path $exeFile) {
            Write-Host "File found, uploading..."
            gh release upload "v${version}" $exeFile --clobber
            Write-Host "Uploaded $exeFile"
          } else {
            Write-Host "ERROR: File not found: $exeFile"
            Write-Host "Available files in $releaseDir :"
            Get-ChildItem -Path $releaseDir | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }

          # Upload updater bundle (.nsis.zip) for auto-update
          $nsisZipFile = Join-Path $releaseDir "GigaWhisper_${version}_x64-${variant}-setup.nsis.zip"
          if (Test-Path $nsisZipFile) {
            gh release upload "v${version}" $nsisZipFile --clobber
            Write-Host "Uploaded updater bundle: $nsisZipFile"
          } else {
            Write-Host "Warning: Updater bundle not found: $nsisZipFile"
          }

      # Generate latest-{variant}.json
      - name: Generate update manifest
        shell: pwsh
        run: |
          $version = "${{ needs.create-release.outputs.version }}"
          $variant = "${{ matrix.variant }}"
          $releaseDir = "src-tauri/target/release/bundle/nsis"

          # Read signature from .nsis.zip.sig (Tauri v2 signs the .nsis.zip updater bundle, not the .exe)
          $sigFile = Join-Path $releaseDir "GigaWhisper_${version}_x64-${variant}-setup.nsis.zip.sig"
          $signature = ""
          if (Test-Path $sigFile) {
            $signature = Get-Content $sigFile -Raw
            # Normalize CRLF to LF to avoid minisign parsing errors
            $signature = $signature.Trim() -replace "`r`n", "`n" -replace "`r", ""
            Write-Host "Signature loaded from $sigFile"
          } else {
            Write-Host "ERROR: Signature file not found: $sigFile"
            Write-Host "Available files:"
            Get-ChildItem -Path $releaseDir | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }

          # Create latest-{variant}.json (URL points to .nsis.zip updater bundle, not .exe)
          $manifest = @{
            version = $version
            notes = "GigaWhisper v${version} (${variant})"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/${{ github.repository }}/releases/download/v${version}/GigaWhisper_${version}_x64-${variant}-setup.nsis.zip"
              }
            }
          }

          $manifestJson = $manifest | ConvertTo-Json -Depth 10
          $manifestFile = "latest-${variant}.json"
          [System.IO.File]::WriteAllText($manifestFile, $manifestJson, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Generated $manifestFile"
          Get-Content $manifestFile

      - name: Upload update manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.create-release.outputs.version }}" "latest-${{ matrix.variant }}.json" --clobber

  # ============================================
  # Publish Release
  # ============================================
  publish-release:
    name: Publish Release
    needs: [create-release, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            })
